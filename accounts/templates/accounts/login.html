<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        form {
            margin-top: 10px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
        }
        input[type="text"],
        input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background-color: #45a049;
        }
        .register-link {
            margin-top: 10px;
            text-align: left;
        }
        .register-link a {
            color: #2255a4; /* 약간 채도가 낮은 파란색 */
            text-decoration: none;
            font-size: 14px; /* 크기를 줄임 */
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>로그인</h1>
        <form method="POST">
            {% csrf_token %}
            <div>
                <label for="username">사용자 이름:</label>
                <input type="text" name="username" required>
            </div>
            <div>
                <label for="password">비밀번호:</label>
                <input type="password" name="password" required>
            </div>
            <div class="register-link">
                <a href="{% url 'register' %}">회원가입 하러 가기</a>
            </div>
            <button type="submit">로그인</button>
        </form>
    </div>
</body>
</html>
